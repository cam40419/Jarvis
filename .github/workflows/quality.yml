name: quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: jarvis_test
          POSTGRES_USER: jarvis
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jarvis -d jarvis_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      JARVIS_TEST_DATABASE_URL: postgresql://jarvis:ci-only@127.0.0.1:5432/jarvis_test
      JARVIS_BROWSER_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,postgres,browser]'
      - run: python -m playwright install --with-deps chromium
      - run: python -m ruff check src tests scripts
      - run: python -m mypy src
      - run: python -m pytest --cov=jarvis --cov-report=term-missing
