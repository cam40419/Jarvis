<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Displays · Simon</title>
  <link rel="stylesheet" href="/assets/theme.css">
  <link rel="stylesheet" href="/assets/displays.css">
</head>
<body class="displays-page">
  <header class="site-topbar"><a class="brand" href="/home"><img src="/assets/simon.svg" alt=""><span>SIMON<small>DISPLAYS</small></span></a><nav aria-label="Main navigation"><a href="/home">Home</a><a href="/automations">Automations</a><a href="/displays" aria-current="page">Displays</a><a href="/chat">Simon</a></nav><a class="account" href="/login">Account</a></header>
  <main>
    <header class="page-header"><div><h1>Idle displays</h1><p>Slideshow screens managed by Simon.</p></div><button id="add">Add a display</button></header>
    <p id="notice" role="status"></p>
    <section id="list"></section>
  </main>
  <dialog id="create-dialog"><form method="dialog"><h2>Add a Raspberry Pi display</h2><label>Name<input id="name" maxlength="80" value="Living room display" required></label><div><button value="cancel">Cancel</button><button id="create" value="default">Create</button></div></form></dialog>
  <dialog id="provision-dialog"><div><h2>Provision the Pi</h2><p>Open this URL once in Chromium on the Pi. Treat it like a password; it is only shown now.</p><textarea id="provision-url" readonly></textarea><button id="copy">Copy URL</button><button id="close-provision">Done</button></div></dialog>
  <script src="/assets/app-path.js"></script>
  <script src="/assets/displays.js"></script>
</body>
</html>
